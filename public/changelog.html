<body class="home">
  <header class="home-nav">
    <a class="brand" href="/" style="text-decoration:none"><span class="logo">F4</span> FUTURE4000</a>
    <nav><a href="/#platform">Platform</a><a href="/#ai">AI</a><a href="/#security">Security</a><a href="/changelog">What's new</a><a class="nav-cta" href="/app">Sign in</a></nav>

  <section class="section">
    <h2>What's new in FUTURE4000</h2>
    <p class="section-sub">New features, improvements and fixes, published as they ship.</p>
    <div class="changelog" id="changelog"></div>
  </section>

  <footer class="home-foot"><span id="copy"></span><span><a href="/">Home</a> · <a href="/app">Sign in</a></span></footer>

  <script>
    document.getElementById('copy').textContent = `© ${new Date().getFullYear()} LaFortune Business Management · FUTURE4000`;
    const entries = [
      ['November 6, 2026', 'New', 'F4 Cloud early-access pages', 'Six new pages for the F4 Cloud developer platform: Overview, Background Workers, Sandboxes, Coding Agents, F4 Code Studio and Templates, each with an early-access waitlist.'],
      ['November 6, 2026', 'New', 'Compliance Blueprint', 'Export a facility\'s complete compliance setup (profile, approved policies with their linked requirements, AI inventory and governance answers) to one file, and import it into another facility. You see a preview first, existing policies are skipped, and imported policies arrive as drafts so each site\'s clinicians approve them.'],
      ['November 6, 2026', 'New', 'F4 Jobs: durable background work', 'Compliance packs now run as background jobs with live progress. Every finished policy is saved as its own step, failed steps retry automatically, and if the server restarts the job resumes where it stopped without redoing finished work. You can leave the page while it runs.'],
      ['November 6, 2026', 'New', 'AI Governance center', 'A live inventory of every AI system (approved, vendor-added and shadow AI), named executive, system and clinical owners, a "Pause all AI" switch restricted to admins and compliance officers, an incident and near-miss register, a decision log, and a 25-question governance readiness score.'],
      ['November 6, 2026', 'New', 'Document Intelligence agents', 'Seven agents that read uploaded PDFs: executive summaries with page references, key information extraction, two-document comparison, research evidence appraisal, contract and Business Associate Agreement review, study guides with quizzes, and committee minutes to action items.'],
      ['November 6, 2026', 'New', 'F4 Studio', 'A video prompt builder for training videos, with a 16-recipe library, a bulk matrix that generates up to 1,000 prompts, audio options, brand colors and a privacy sweep in every prompt.'],
      ['November 6, 2026', 'New', '4000 Connect for payments', 'Connect the payment system you already use: Stripe, Square, PayPal and Braintree, Authorize.net or Adyen with a live key test, plus guided setup for InstaMed, Flywire, Clover, Checkout.com and others. Keys are encrypted before storage, never shown again, test mode comes first, and every change is logged.'],
      ['November 6, 2026', 'New', 'LearnTrack training', 'Every approved policy becomes a course with objectives, a clinical scenario and a 10-question quiz. Passing at 80% issues a printable certificate and records the staff sign-off.'],
      ['November 6, 2026', 'Improved', 'Command-center dashboard', 'New sidebar navigation, five key metrics, a survey-readiness chart, policy pipeline, recent activity and a cleaner federal updates feed. The layout now uses the full width of large screens.'],
      ['November 6, 2026', 'Improved', 'Claude features', 'Policy Gap Review reads your existing policies, prompt caching makes repeat requests faster, optional AWS Guardrails add a second patient-data screen, and optional deeper reasoning supports the heaviest drafting tasks.'],
      ['November 6, 2026', 'New', 'F4 Templates', 'Fifteen one-click compliance packs, from HIPAA to Infection Prevention to Home Health and EVV, that create every required policy as a linked draft.'],
      ['November 6, 2026', 'New', 'F4 Daily Scan', 'Every morning at 8:30 AM Eastern: new rules and notices from CMS, HHS, OSHA, DEA, SAMHSA and FDA, policies due for review, stalled reviews, missing sign-offs and integration health.'],
      ['November 6, 2026', 'New', 'Policy workflow and audit log', 'Versioned policies, clinician approval (authors cannot approve their own work), staff sign-off tracking, encrypted archive of approved versions, and a surveyor-ready audit log with one-click export.'],
      ['November 6, 2026', 'New', 'F4 Connect (now 4000 Connect)', '23 connectors across healthcare, cloud and AI, business and media, each showing the weaknesses it fixes and a live connection test where one exists.']
    ];
    const tag = { New: 'st-approved', Improved: 'lvl-federal', Fixed: 'st-in_review' };
    document.getElementById('changelog').innerHTML = entries.map(([d, t, title, body]) => `
      <article class="cl"><div class="cl-date">${d}</div><div class="cl-body"><span class="tag ${tag[t]}">${t}</span><h3>${title}</h3><p>${body}</p></div></article>`).join('');
  </script>
</body>
</html>
